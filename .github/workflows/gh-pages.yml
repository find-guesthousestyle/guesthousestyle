# main 에 올리면(push) 사이트를 빌드해서 완성 파일(dist)을 gh-pages 브랜치에 올립니다.
# 한경 웹진(lxwebzine.hankyung.com/2026-1/team4/)은 이 gh-pages 브랜치의 파일을 가져가 게시합니다.
name: Build to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # .nojekyll — 정적 호스팅이 _ 로 시작하는 파일을 숨기지 않게
      # vercel.json — Vercel 이 이 브랜치까지 미리보기로 배포하지 않게
      - run: |
          touch dist/.nojekyll
          echo '{"git":{"deploymentEnabled":false}}' > dist/vercel.json
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: 'gh-pages 배포 — main 빌드'
